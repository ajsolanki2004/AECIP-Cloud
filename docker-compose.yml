version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aecip-postgres
    restart: always
    environment:
      POSTGRES_DB: enterprise_segmentation_v2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_segmentation_v2"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: aecip-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=enterprise_segmentation_v2
      - DB_USER=postgres
      - DB_PASS=postgrespassword
      - DB_SSLMODE=disable
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AECIP_S3_BUCKET=${AECIP_S3_BUCKET:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - models_data:/app/models/saved

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: aecip-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=enterprise_segmentation_v2
      - DB_USER=postgres
      - DB_PASS=postgrespassword
      - DB_SSLMODE=disable
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AECIP_S3_BUCKET=${AECIP_S3_BUCKET:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - models_data:/app/models/saved

volumes:
  pgdata:
  models_data:
